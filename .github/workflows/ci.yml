name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: living_in_interiors
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_ACCESS_SECRET: ci_access_secret_that_is_longer_than_32_characters
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_longer_than_32_characters
      BCRYPT_SALT_ROUNDS: '12'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: living_in_interiors
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Run migrations
        run: pnpm migration:run

      - name: Seed
        run: pnpm seed

      - name: Build
        run: pnpm build

      - name: Smoke: boot server & probe /health
        run: |
          PORT=3100 node dist/main & APP_PID=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/v1/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          kill $APP_PID || true
          if [ "$ready" != "1" ]; then
            echo "server did not become ready in time"
            exit 1
          fi
          cat /tmp/health.json
          echo
          grep -q '"up":true' /tmp/health.json || { echo "health db.up is false"; exit 1; }

      - name: E2E (golden path + concurrency)
        run: pnpm test:e2e

      - name: Load sanity check (10x fixture, lists < 300ms)
        run: pnpm load:check
